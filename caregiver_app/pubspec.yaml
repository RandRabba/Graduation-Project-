name: caregiver_app
description: Caregiver module for the Diabetes Monitoring and Meal Analysis System (standalone app and embeddable module).
publish_to: 'none'
version: 1.0.0+1

environment:
  # Same SDK as the Patient app, whose theme this module now mirrors (it uses
  # DialogThemeData and other recent Material APIs).
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
